name: Defect
description: A defect found during testing (feeds the STP defect log)
title: "[Defect] "
labels: ["type: defect"]
body:
  - type: input
    id: testcase
    attributes:
      label: Test case that failed
      placeholder: TC-SALES-02
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["Critical", "Major", "Minor", "Trivial"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual result
    validations:
      required: true
